<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장 준비 | NEXT STAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="chrome"></div>
<main class="wrap" id="app"><div id="head"></div>
<div class="tabpane" data-tab="당일 공정표"><div class="sec-head"><h2>공연 당일 공정표</h2><p>스탭 콜타임 09:00, 출연진 콜타임 13:00 기준입니다</p></div>
<div class="tablewrap" style="margin-bottom:72px"><table class="t" id="tt"></table></div></div>
<div class="tabpane" data-tab="좌석 구역"><div class="sec-head"><h2>좌석 구역</h2><p>10월 5일 구역 구분안입니다. 카메라 위치 확인 후 수정될 수 있습니다</p></div>
<p style="margin-bottom:20px"><a class="pill" href="11-seat-zones.html">좌석 배치도 열기 · 편집 · 인쇄</a></p>
<div class="tablewrap" style="margin-bottom:72px"><table class="t" id="seats"></table></div></div>
<div class="tabpane" data-tab="스탭 · 식사 · 안전"><div class="row2" style="margin-bottom:72px"><div class="card"><h3 style="margin-bottom:16px">스탭과 담당</h3><div class="kv" id="people" style="margin-top:0"></div></div>
<div class="card"><h3 style="margin-bottom:16px">식사와 장비</h3><ul class="plain" id="meals"></ul><div class="revbox"><b>안전교육</b>출연자와 스탭 전원이 공연장 사이버아카데미 안전교육 1시간 이수 후 수료증을 제출해야 합니다 (기한 10/5, 제출 현황 확인 필요)</div></div></div></div>
</main>
<div id="foot"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/plan.js"></script>
<script>
NS.chrome(6);
document.getElementById('head').innerHTML=NS.head('현장 준비','당일 운영 타임테이블','스탭 콜 09:00, 출연진 콜 13:00 기준의 공정, 좌석 구역, 스탭 편성, 식사 계획입니다');
document.getElementById('tt').innerHTML='<thead><tr><th>시간</th><th>단계</th><th>내용</th><th>담당</th></tr></thead><tbody>'+NS.D.timetable.map(function(r){return '<tr><td>'+r[0]+'</td><td style="color:var(--ink);font-weight:600">'+r[1]+'</td><td>'+r[2]+'</td><td>'+r[3]+'</td></tr>';}).join('')+'</tbody>';
document.getElementById('seats').innerHTML='<thead><tr><th>구분</th><th>위치</th><th>좌석</th></tr></thead><tbody>'+NS.D.seats.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join('')+'</tbody>';
document.getElementById('people').innerHTML=NS.D.people.map(function(p){return '<div>'+p[0]+'<b>'+p[1]+'</b></div>';}).join('');
document.getElementById('meals').innerHTML=NS.D.meals.map(function(m){return '<li>'+m+'</li>';}).join('');
NS.tabs();
</script></body></html>
