<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입퇴장 콘티 | NEXT STAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="chrome"></div>
<main class="wrap" id="app"><div id="head"></div>
<div class="toolrow noprint"><button class="tbtn pri" data-t="svg">현재 화면 SVG 저장</button><button class="tbtn" data-t="all">전체 보기 후 인쇄</button></div>
<div id="cp"></div></main>
<div id="foot"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/plan.js"></script><script src="assets/conti.js"></script>
<script>
NS.chrome(13);
document.getElementById('head').innerHTML=NS.head('백스테이지','백스테이지 입퇴장 콘티','출연자 입퇴장 타임라인, 큐별 동선 콘티 카드, 윙 동선표를 한 흐름으로 정리했습니다. 각 카드에 무대 상태, 입퇴장 방향, 윙 대기, 음향 · 조명 · 호출이 함께 들어 있습니다');
var CT=NS.conti,box=document.getElementById('cp');
function pane(tab,html){var p=document.createElement('div');p.className='tabpane';p.setAttribute('data-tab',tab);p.innerHTML=html;box.appendChild(p);}
pane('출연자 타임라인','<div class="card white" style="padding:14px">'+CT.timeline()+'</div><div class="row3" style="margin-top:16px"><div class="card"><h3>읽는 법</h3><ul class="plain" style="margin-top:12px"><li>한 줄은 한 사람(또는 한 팀)입니다</li><li>검정 막대는 무대 위, 회색은 윙에서 대기하는 구간입니다</li><li>회색 막대 바로 뒤 검정 막대가 시작되는 지점이 입장입니다</li></ul></div><div class="card"><h3>무지연 연결 구간</h3><p class="sub" style="margin-top:12px">붉은 점선 안의 큐는 사회 없이 이어집니다. 3 · 4 · 5번, 6 · 7 · 8번, 중간 영상 · 9 · 10번, 12 · 13번, 파이널 영상 · 14번입니다. 이 구간에서는 입퇴장이 동시에 일어나므로 윙 스탭의 신호가 가장 중요합니다</p></div><div class="card"><h3>확인이 필요한 부분</h3><ul class="plain" style="margin-top:12px"><li>2단 코러스 4석을 곡별로 쓰는 인원과 입퇴장 방식</li><li>앙상블 14명의 SL · SR 배분</li><li>풍물 4인이 연주하는 무대 위 위치</li></ul></div></div>');
CT.groups.forEach(function(g){var h='<div class="cgrid">';for(var i=g[1];i<=g[2];i++)h+=CT.cardHtml(i);pane(g[0],h+'</div>');});
pane('윙 동선표','<div class="tablewrap"><table class="t">'+CT.wingTable()+'</table></div><p class="sub" style="margin-top:12px">SL · SR은 무대 위 배우 기준입니다. 분장실이 모두 SR 측에 있어 SL 대기 인원은 하늘막 뒤 후방 통로(약 1.7m)로 이동합니다</p>');
document.querySelector('.toolrow').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;
 if(b.dataset.t==='svg'){var pn=[].slice.call(document.querySelectorAll('.tabpane')).filter(function(p){return !p.hidden;})[0];var sv=pn&&pn.querySelector('svg');if(!sv){return;}var vb=sv.getAttribute('viewBox').split(' ');var txt=sv.outerHTML.replace('<svg ','<svg width="'+vb[2]+'" height="'+vb[3]+'" ');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));a.download='NEXT_STAGE_입퇴장콘티.svg';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);}
 else{var all=document.querySelector('.subnav .all');if(all)all.click();setTimeout(function(){window.print();},200);}
});
NS.tabs();
</script></body></html>
