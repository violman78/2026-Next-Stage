<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회자 대본 | NEXT STAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="chrome"></div>
<main class="wrap" id="app"><div id="head"></div><div id="list"></div></main>
<div id="foot"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/plan.js"></script>
<script>
NS.chrome(2);
document.getElementById('head').innerHTML=NS.head('사회 진행','사회 진행 대본','사회는 프로그램표에 지정된 8개 지점에서만 진행하며, 곡 사이에 별도의 멘트를 추가하지 않습니다. 현재 대본은 확정 전 초안이며, 사회는 박한솔이 맡습니다');
var MCL=['① 오프닝','② 산조 후','③ 3 · 4 · 5번','④ 6 · 7 · 8번','⑤ 중간 영상','⑥ 타악 협주','⑦ 피날레 안내','⑧ 클로징'];
document.getElementById('list').innerHTML=NS.D.mcScripts.map(function(m){
 return '<article class="mc"><div><div class="code">'+m.cue+' · '+m.n+'번째 멘트</div><h3>'+m.title+'</h3><div class="cues"><span class="tag blue" style="width:fit-content">'+m.pos+'</span><div><b>시작</b>'+NS.esc(m.inCue)+'</div><div><b>마무리</b>'+NS.esc(m.outCue)+'</div></div></div><div class="script">'+m.paras.map(function(p){return '<p>'+p+'</p>';}).join('')+(m.note?'<div class="note">'+m.note+'</div>':'')+'</div></article>';}).join('');
[].forEach.call(document.querySelectorAll('#list .mc'),function(a,k){a.classList.add('tabpane');a.setAttribute('data-tab',MCL[k]);});
NS.tabs();
</script></body></html>
