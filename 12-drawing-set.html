<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무대 도면 세트 | NEXT STAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="chrome"></div>
<main class="wrap" id="app"><div id="head"></div>
<div class="toolrow noprint" id="dtools"></div>
<div id="sheets"></div></main>
<div id="foot"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/plan.js"></script><script src="assets/calc.js"></script><script src="assets/drawset.js"></script>
<script>
NS.chrome(12);
document.getElementById('head').innerHTML=NS.head('무대 도면','무대 도면 세트 (Drawing Set)','평면 · 종단면 · 정면 · 축측 도면에 덧마루, 영사, 안전 수치 계산을 적용한 A3 도면 7장입니다. 단 위치와 높이는 배치안이며 확정되면 수치가 함께 바뀝니다');
var K=window.NS_CALC,P=K.P,DW=NS.dwg;
function tb(no,name,sc){return '<div class="tblock"><div class="tm"><small>도면명</small><b>'+name+'</b></div><div><small>도면번호</small><b>'+no+'</b></div><div><small>축척</small><b>'+sc+'</b></div><div><small>일자 · 개정</small><b>2026.10.06 · 최종 반영안</b></div><div><small>공연 · 장소</small><b>NEXT STAGE 10.7 · 빛고을시민문화관</b></div></div>';}
function sheet(tab,no,name,sc,inner){var p=document.createElement('div');p.className='tabpane';p.setAttribute('data-tab',tab);p.innerHTML='<section class="dsheet"><div class="dbody">'+inner+'</div>'+tb(no,name,sc)+'</section>';document.getElementById('sheets').appendChild(p);}
function tbl(head,rows,cls){return '<div class="tablewrap"><table class="t"><thead><tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
sheet('평면도','SP-01','무대 평면도 (GROUND PLAN)','약 1/100 (A3)',NS.planSvg(null,{master:true})+'<p class="dnote">좌표 원점은 중심선과 영점선(본무대선)의 교점, x는 SL 방향 +, y는 무대 뒤 +입니다. 라인셋 번호와 거리는 극장 기술자료(Line set schedule)를 따릅니다. 객석이 아래이며 SR이 화면 왼쪽입니다</p>');
sheet('종단면도','SP-02','종단면도 (SECTION A-A)','수평 1/66 · 수직 동일 (A3)',DW.section());
sheet('정면도','SP-03','정면도 (FRONT ELEVATION)','약 1/56 (A3)',DW.front());
sheet('축측도','SP-04','축측도 (OBLIQUE VIEW)','NTS',DW.iso());
var tA=K.layout.length;
sheet('덧마루 구성','SP-05','덧마루 구성도 및 소요 수량','폭 1/78 (A3)',DW.risers()+'<h3 class="dh">안 비교와 보유 수량 대조</h3>'+tbl(['안','1 · 2 · 3단 상면 높이','단 사이 단차','적층 층수','필요 길이(연속)','필요 길이(사용 구간만)','보유 길이','판정'],[
['안 A','15 / 30 / 45cm','15cm','1 · 2 · 3층 = 6층',K.strip_A_cont+'m',K.strip_A_min+'m',K.strip_stock+'m','<span class="ok">구성 가능</span> (여유 '+(K.strip_stock-K.strip_A_cont).toFixed(1)+'m, 보유 모듈 대부분 소진)'],
['안 B','30 / 60 / 90cm','30cm','2 · 4 · 6층 = 12층',K.strip_B_cont+'m',K.strip_B_min+'m',K.strip_stock+'m','<span class="ng">보유 초과</span> (연속 '+(K.strip_B_cont/K.strip_stock).toFixed(1)+'배): 받침통 80개와 3단 합창단 6세트 병용 필요']])
+'<h3 class="dh">안 A 모듈 사용 내역 (폭 13.2m 연속, 6층)</h3>'+tbl(['모듈 (mm)','보유','사용','잔여'],K.bom.map(function(r){return [r.name,r.stock,r.used,r.left];}))
+'<p class="dnote">산출 방법: 각 층은 폭 13.2m를 깊이 1.8m 모듈의 폭 합으로 채운다고 보고, 필요 길이 = 층수 × 13.2m, 보유 길이 = Σ(모듈 폭 × 수량) = '+K.strip_stock+'m로 비교했습니다. 사용 구간만 쌓는 경량안은 단 사이 빈 공간이 생겨 미관과 안전상 권장하지 않습니다. 안 B는 단차 30cm라 측면 승강 계단이 추가로 필요합니다</p>');
var c=K.proj;
sheet('영사 계산','SP-06','영사 계산서 (PROJECTION)','NTS',
 '<div class="dgrid"><div>'+DW.proj()+'</div><div><h3 class="dh" style="margin-top:0">기본 계산</h3>'+tbl(['항목','계산','결과'],[
['투사 거리','프로젝터 y '+c.yp+'m − 샤막 y '+P.scrim_y+'m',c.d+'m'],
['필요 투사비','투사 거리 ÷ 영상 폭 '+P.scrim_w+'m',c.ratio+' : 1'],
['영상 높이 (16:9)',P.scrim_w+'m × 9 ÷ 16',c.h169+'m  <span class="ok">샤막 H9.0m 이내</span>'],
['영상 높이 (16:10)',P.scrim_w+'m × 10 ÷ 16',c.h1610+'m  <span class="ng">샤막 높이 초과</span>'],
['영상 면적 (16:9)',P.scrim_w+' × '+c.h169,c.area169+'㎡'],
['공칭 조도 (손실 전)','20,000 lm ÷ '+c.area169+'㎡',c.lux20k+' lx'],
['극장 보유 프로젝터','15,000 ANSI lm ÷ '+c.area169+'㎡',c.lux15k+' lx']])
+'<h3 class="dh">프로젝터 위치별 필요 투사비</h3>'+tbl(['프로젝터 y','투사 거리','필요 투사비'],K.throw.map(function(r){return [r.y+'m',r.d+'m',r.ratio+' : 1'];}))
+'<h3 class="dh">빔 하단이 연주자 머리를 넘는 최소 프로젝터 높이</h3>'+tbl(['위치','머리 높이 A / B','필요 높이 A','필요 높이 B','3.0m 스탠드'],K.clear.map(function(r){return [r.label+' (y '+r.y+')',r.HA+' / '+r.HB+'m',r.A+'m',r.B+'m',(K.hp>=r.A?'<span class="ok">A 가능</span>':'<span class="ng">A 부족</span>')+' · '+(K.hp>=r.B?'<span class="ok">B 가능</span>':'<span class="ng">B 부족</span>')];}))
+'<p class="dnote">가정: 샤막 하단 0.3m, 영상은 샤막 중앙에 16:9로 배치(영상 하단 z '+c.z_b+'m), 프로젝터 y '+c.yp+'m. 연주자 머리 높이는 서서 1.7m, 앉아서 1.3m입니다. 빔 하단보다 낮은 연주자는 영상 하단에 그림자가 생기며 스탭회의에서 감안 가능하다고 했습니다. 외부 프로젝터는 렌즈 교체가 어렵다고 안내받았으므로 투사비 '+c.ratio+' : 1을 낼 수 있는지 영상 감독 확인이 필요합니다</p></div></div>');
var f=function(v){return v;};
sheet('치수 · 수치 일람','SP-07','치수 및 수치 일람표','—',
 '<div class="dgrid"><div><h3 class="dh" style="margin-top:0">기준 치수 (극장 기술자료)</h3>'+tbl(['항목','값'],[
['프로시니엄 개구부','W'+P.prosc_w+' × H'+P.prosc_h+'m'],['공연 영역','W'+P.main_w+' × D'+P.main_d+'m = '+K.main_area+'㎡ (자료 197㎡)'],['무대 앞선 / 면막선','−1.915m / 0.74m'],['첫 · 마지막 라인셋','1.18m / 12.06m'],['하늘막 / 흑막','12.93m / 13.70m (H9.0m)'],['뒷벽','15.40m'],
['SL 측벽 / SR 측벽','중심선에서 11.60m / 11.97m (SR 측무대 26.10m)'],['무대 바닥','참나무 22mm 유광 바니시, 경사 0'],['객석 바닥','−0.70m'],['덧마루','높이 150mm 모듈 (보유 모듈 표는 SP-05)'],['샤막','15 × 9m 블랙 · 화이트 각 1장 (극장 보유)'],['돗자리','6.8 × 3.0m (강화화문석)'],['연주용 의자 / 보면대','500×570 · 100개 / 75개']])
+'</div><div><h3 class="dh" style="margin-top:0">산출 결과</h3>'+tbl(['항목','계산','결과'],[
['단 1개 면적','13.2 × 1.8',K.tier_area+'㎡'],['단 3개 합계',''+K.tier_area+' × 3',K.tier_total+'㎡ (공연 영역의 '+K.tier_pct+'%)'],['후방 간격','하늘막 12.93 − 단 후면 11.40',K.gap_back+'m'],['연기 공간 깊이','1단 앞 6.00 − 샤막 1.18',K.dsc_depth+'m'],['연기 공간 면적','14.6 × '+K.dsc_depth,K.dsc_area+'㎡'],['앙상블 1인당 면적',''+K.dsc_area+' ÷ 14명',K.per_person_dsc+'㎡'],['후방 통로 폭','뒷벽 15.40 − 흑막 13.70',K.crossover+'m'],['SL 윙 폭','11.60 − 7.40',K.sl_wing+'m'],['SR 윙 폭','11.97 − 7.40',K.sr_wing+'m (측무대 26.10m까지 확장)']])
+'<h3 class="dh">안전 관련 수치</h3>'+tbl(['항목','안 A','안 B'],[['3단 후면 낙하 높이',K.fall.A+'m',K.fall.B+'m'],['단 사이 단차','15cm','30cm (일반 보행 계단 단높이 약 18cm 이하를 넘어 승강 계단 필요)'],['덧마루 필요 길이 / 보유 '+K.strip_stock+'m',K.strip_A_cont+'m','<span class="ng">'+K.strip_B_cont+'m</span>']])
+'<p class="dnote">한계: 단 위치와 높이, 프로젝터 위치, 샤막 하단 높이는 현재 배치안 또는 가정입니다. 극장 장비 자료는 2014 ~ 2016년 기준이며, 단 위 허용 하중과 후면 안전 조치는 극장 무대감독 확인이 필요합니다. 일반 보행 계단 단높이는 참고용 비교 값이며 법정 기준 검토를 대신하지 않습니다</p></div></div>');
document.getElementById('dtools').innerHTML='<button class="tbtn pri" data-t="svg">현재 도면 SVG 저장</button><button class="tbtn" data-t="all">전체 보기 후 인쇄 (A3 가로)</button><a class="tbtn" href="files/stage-drawing-calc.xlsx" download>수치 계산서 엑셀</a><a class="tbtn" href="12-drawing-set.html#t=0">처음으로</a>';
document.getElementById('dtools').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;
 if(b.dataset.t==='svg'){var pane=[].slice.call(document.querySelectorAll('.tabpane')).filter(function(p){return !p.hidden;})[0];var sv=pane&&pane.querySelector('svg');if(!sv)return;var vb=sv.getAttribute('viewBox').split(' ');var txt=sv.outerHTML.replace('<svg ','<svg width="'+vb[2]+'" height="'+vb[3]+'" ');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));a.download='NEXT_STAGE_'+pane.getAttribute('data-tab')+'.svg';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);}
 else{var all=document.querySelector('.subnav .all');if(all)all.click();setTimeout(function(){window.print();},200);}
});
NS.tabs();
</script></body></html>
