<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음향 · 조명 콘티 | NEXT STAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head><body>
<div id="chrome"></div>
<main class="wrap" id="app"><div id="head"></div>
<div class="toolrow noprint"><button class="tbtn pri" data-t="svg">현재 화면 SVG 저장</button><button class="tbtn" data-t="all">전체 보기 후 인쇄</button></div>
<div id="sl"></div></main>
<div id="foot"></div>
<script src="assets/data.js"></script><script src="assets/app.js"></script><script src="assets/plan.js"></script><script src="assets/conti.js"></script><script src="assets/soundlight.js"></script>
<script>
NS.chrome(14);
document.getElementById('head').innerHTML=NS.head('음향 · 조명','음향 · 조명 콘티','큐 순서대로 마이크와 음원의 사용, 조명 색과 샤막 상태, 호출 신호를 정리한 콘티입니다. 조명 색은 큐시트의 문구를 색 칩으로 옮긴 것이며 실제 값은 조명 감독이 확정합니다');
var SL=NS.sl,box=document.getElementById('sl');
function pane(tab,html){var p=document.createElement('div');p.className='tabpane';p.setAttribute('data-tab',tab);p.innerHTML=html;box.appendChild(p);}
var S=SL.summary();
pane('마이크 매트릭스','<div class="card white" style="padding:14px">'+SL.matrix()+'</div>');
pane('조명 콘티','<div class="card white" style="padding:14px;margin-bottom:16px">'+SL.strip()+'</div><div class="lgrid">'+SL.lightCards()+'</div>');
pane('큐별 콘티표','<div class="tablewrap"><table class="t">'+SL.table()+'</table></div>');
pane('호출 체인','<div class="tablewrap"><table class="t">'+SL.chain()+'</table></div><p class="sub" style="margin-top:12px">호출은 연출이 부르고, 무지연 구간은 앞 곡 종료와 동시에 다음 큐를 실행합니다. 예상 시간은 사회 구간만 큐시트 기준이며 나머지는 드레스 리허설에서 실측합니다</p>');
pane('수량 · 장비 요약','<div class="row3" style="margin-bottom:16px"><div class="metric"><span class="k">샤막 하강 큐</span><div><div class="v">'+S.down+'<small>개</small></div><p class="d">전면 조명 차단, 영상 영사</p></div></div><div class="metric"><span class="k">사회 핀스팟</span><div><div class="v">'+S.mc+'<small>회</small></div><p class="d">극장 팔로우 스팟 2대 보유 (3층 핀라이트실)</p></div></div><div class="metric"><span class="k">무지연 전환</span><div><div class="v">'+S.chains+'<small>곳</small></div><p class="d">3→4→5, 6→7→8, 9→10, 12→13 구간 포함</p></div></div></div>'+
 '<h3 style="margin:8px 0 10px;font-size:20px">음향 수량 대조</h3><div class="tablewrap" style="margin-bottom:24px"><table class="t"><thead><tr><th>항목</th><th>이번 공연 소요</th><th>극장 보유 (2016 자료)</th><th>판단</th></tr></thead><tbody><tr><td>무선 핸드 (보컬)</td><td>동시 최대 2대 (9 · 10번)</td><td>수신기 20 · 송신기 14 · 핸드 6</td><td><span class="ok">충분</span></td></tr><tr><td>사회자 무선</td><td>1 (보컬과 동시 사용 없음)</td><td>위와 동일</td><td><span class="ok">충분</span></td></tr><tr><td>코러스 스탠드 마이크</td><td>4개 통일 (곡별 2~4명 사용)</td><td>붐 T형 스탠드 20 · 구즈넥 10</td><td><span class="ok">충분</span></td></tr><tr><td>보컬 스탠드</td><td>1개 (5 · 7번)</td><td>위와 동일</td><td><span class="ok">충분</span></td></tr><tr><td>앙상블 14명 · 풍물 4인</td><td>구성 미정</td><td>—</td><td><span class="ng">확인 필요</span></td></tr><tr><td>국악 · 드럼 · 스트링 · 밴드</td><td>유선 마이킹 · DI (수량은 음향 감독 산정)</td><td>다이나믹 · 콘덴서 다수, DI 3개</td><td><span class="ng">산정 필요</span></td></tr></tbody></table></div>'+
 '<h3 style="margin:8px 0 10px;font-size:20px">조명 라인 사용 계획 (배치안)</h3><div class="tablewrap"><table class="t"><thead><tr><th>라인</th><th>위치</th><th>용도</th><th>비고</th></tr></thead><tbody><tr><td>앞무대 조명</td><td>y −0.92m</td><td>DSC 앞쪽 워시와 사회 핀</td><td>—</td></tr><tr><td>조명봉 #1</td><td>y 2.28m</td><td>연기 공간 전면 워시, 보컬 팔로우</td><td>샤막(1.18m) 뒤쪽</td></tr><tr><td>조명봉 #2</td><td>y 5.78m</td><td>1단 앞 경계, 스트링 · 국악 워시</td><td>단 설치 전 작업</td></tr><tr><td>조명봉 #3</td><td>y 9.23m</td><td>밴드 · 드럼 단 상부 워시</td><td class="ng">단 위: 설치 전 작업 후 상승</td></tr><tr><td>하늘막 상단 조명</td><td>y 11.21m</td><td>후방 컬러 워시, 하늘막 영사 보조</td><td class="ng">단 위: 설치 전 작업</td></tr><tr><td>측면 조명타워 6</td><td>SL 3 · SR 3 (윙)</td><td>사이드 라이트, 출연자 입퇴장 가이드 라이트</td><td>위치 개략</td></tr></tbody></table></div><p class="sub" style="margin-top:12px">조명 콘솔은 ETC ION 1024, 디머는 총 277채널입니다. 극장 장비 목록에 없는 무빙 조명은 극장 확인이 필요합니다</p>');
document.querySelector('.toolrow').addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(!b)return;
 if(b.dataset.t==='svg'){var pn=[].slice.call(document.querySelectorAll('.tabpane')).filter(function(p){return !p.hidden;})[0];var sv=pn&&pn.querySelector('svg');if(!sv){return;}var vb=sv.getAttribute('viewBox').split(' ');var txt=sv.outerHTML.replace('<svg ','<svg width="'+vb[2]+'" height="'+vb[3]+'" ');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'image/svg+xml'}));a.download='NEXT_STAGE_'+pn.getAttribute('data-tab')+'.svg';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);}
 else{var all=document.querySelector('.subnav .all');if(all)all.click();setTimeout(function(){window.print();},200);}
});
NS.tabs();
</script></body></html>
